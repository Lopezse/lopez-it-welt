# ChromaDB Docker Compose - Enterprise++ Standard
#
# Self-Hosted ChromaDB für RAG-System
# Port: 8000
# Volume: chromadb_data (persistente Embeddings)
#
# @created 2025-11-29
# @purpose Phase R1.6: ChromaDB Setup
# @status ✅ PRODUKTIONSREIF

version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: lopez-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lopez-network

volumes:
  chromadb_data:
    driver: local
    name: lopez_chromadb_data

networks:
  lopez-network:
    driver: bridge
    name: lopez-network



